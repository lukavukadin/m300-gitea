replicaCount: 3

service:
  http:
    type: ClusterIP
    port: 3000
  ssh:
    type: ClusterIP
    port: 22

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  hosts:
    - host: git.lukavukadin.ch
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: gitea-tls
      hosts:
        - git.lukavukadin.ch

gitea:
  admin:
    username: "admin"
    password: "PLACEHOLDER"
    email: "luka.vukadin7@gmail.com"

  config:
    APP_NAME: "Gitea M300"
    server:
      ROOT_URL: "https://git.lukavukadin.ch/"
      DOMAIN: "git.lukavukadin.ch"

    database:
      DB_TYPE: postgres
      HOST: "gitea-postgres-rw:5432"
      NAME: "gitea"
      USER: "gitea"
      PASSWD: "PLACEHOLDER"

persistence:
  enabled: true
  size: 10Gi
  accessModes:
    - ReadWriteMany
  storageClass: "standard-rwx"

resources:
  requests:
    cpu: "200m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

postgresql:
  enabled: false

postgresql-ha:
  enabled: false