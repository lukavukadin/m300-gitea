apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: gitea-postgres
  namespace: default
spec:
  instances: 3
  
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "256MB"

  bootstrap:
    initdb:
      database: gitea
      owner: gitea
      secret:
        name: gitea-postgres-credentials

  storage:
    size: 5Gi
    storageClass: standard

  serviceAccountTemplate:
    metadata:
      annotations:
        iam.gke.io/gcp-service-account: cnpg-backup@m300-gitea.iam.gserviceaccount.com

  backup:
    barmanObjectStore:
      destinationPath: gs://m300-gitea-postgres-backup
      googleCredentials:
        gkeEnvironment: true
    retentionPolicy: "7d"

---
apiVersion: v1
kind: Secret
metadata:
  name: gitea-postgres-credentials
  namespace: default
type: kubernetes.io/basic-auth
stringData:
  username: gitea
  password: "PLACEHOLDER"

---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: gitea-postgres-backup
  namespace: default
spec:
  schedule: "0 2 * * *"
  backupOwnerReference: self
  cluster:
    name: gitea-postgres